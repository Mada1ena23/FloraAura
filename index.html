<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FloraAura - Cuidar da Natureza com Tecnologia</title>
  
  <!-- Manifest & Meta PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#315c45">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FloraAura">
  <link rel="apple-touch-icon" href="/assets/images/icons/icon-192x192.png">

  <!-- Estilos -->
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <!-- Cabeçalho Principal -->
  <header class="app-header">
    <div class="logo-container">
      <img src="/assets/images/logo.svg" alt="Logótipo FloraAura" class="logo" onerror="this.style.display='none'">
      <h1>FloraAura</h1>
    </div>
    <button id="pwa-install-btn" class="btn-install" hidden>Instalar App</button>
  </header>

  <!-- Navegação Principal -->
  <nav class="app-nav">
    <button class="nav-btn active" data-target="meu-jardim">Meu Jardim</button>
    <button class="nav-btn" data-target="catalogo">Catálogo</button>
    <a href="/pages/sobre.html" class="nav-link">Sobre</a>
  </nav>

  <!-- Conteúdo Principal -->
  <main class="app-content">
    <!-- Secção: O Meu Jardim -->
    <section id="meu-jardim" class="tab-content active">
      <div class="section-header">
        <h2>As Minhas Plantas</h2>
        <button id="btn-add-plant" class="btn-primary">+ Adicionar Planta</button>
      </div>
      <div id="user-plants-grid" class="plants-grid">
        <p class="empty-state">Ainda não adicionaste nenhuma planta ao teu jardim. Clica no botão acima para começar!</p>
      </div>
    </section>

    <!-- Secção: Catálogo de Espécies -->
    <section id="catalogo" class="tab-content">
      <h2>Explorar Espécies</h2>
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Pesquisar por nome ou espécie...">
      </div>
      <div id="catalog-grid" class="plants-grid">
        <!-- Plantas carregadas via JavaScript -->
      </div>
    </section>
  </main>

  <!-- Modal / Formulário para Registar Nova Planta -->
  <dialog id="modal-add-plant" class="app-modal">
    <form id="form-plant" method="dialog">
      <h3>Registar Nova Planta</h3>
      
      <label for="plant-name">Nome da Planta:</label>
      <input type="text" id="plant-name" required placeholder="Ex: Monstera Deliciosa">

      <label for="plant-species">Espécie / Variedade:</label>
      <input type="text" id="plant-species" placeholder="Ex: Costela-de-Adão">

      <label for="plant-water">Frequência de Rega:</label>
      <select id="plant-water" required>
        <option value="Diária">Diária</option>
        <option value="A cada 2-3 dias">A cada 2-3 dias</option>
        <option value="Semanal">Semanal</option>
        <option value="Quinzenal">Quinzenal</option>
      </select>

      <label for="plant-light">Luminosidade Necessária:</label>
      <select id="plant-light" required>
        <option value="Luz Solar Direta">Luz Solar Direta</option>
        <option value="Luz Indireta Forte">Luz Indireta Forte</option>
        <option value="Sombra Parcial">Sombra Parcial</option>
        <option value="Sombra">Sombra</option>
      </select>

      <div class="modal-actions">
        <button type="button" id="btn-cancel" class="btn-secondary">Cancelar</button>
        <button type="submit" class="btn-primary">Guardar Planta</button>
      </div>
    </form>
  </dialog>

  <!-- JavaScript Modular -->
  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
